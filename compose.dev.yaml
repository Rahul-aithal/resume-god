# Local development overrides: live reload + host ports.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# URLs in dev mode (the SPA is the only UI):
#   http://localhost:5173  React SPA (vite HMR, proxies /api + /files)
#   http://localhost:3000  NestJS server (JSON API + auth)
#   localhost:5432         Postgres (dev only — drizzle-kit, tests)
services:
  db:
    ports:
      # Dev only — never expose Postgres in production.
      - "5432:5432"

  server:
    user: root
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://resume_god:resume-god-local@db:5432/resume_god
    volumes:
      # Live source; outputs persist on the shared volume.
      - ./apps/server:/app/apps/server
      - ./packages:/app/packages
      - server-data:/data
    command: sh -c "cd /app/apps/server && bun install && bun --watch run src/main.ts"
    depends_on:
      db:
        condition: service_healthy

  web:
    # Dev image with bun; the prod image (nginx) cannot run vite.
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    ports:
      - "5173:5173"
    environment:
      # Vite proxies /api and /files to the NestJS server.
      VITE_API_PROXY: http://server:3000
    volumes:
      - .:/repo
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/api-client/node_modules
    working_dir: /repo/apps/web
    command: sh -c "bun install && bun run dev -- --host --port 5173"
    depends_on:
      - server

volumes:
  server-data:
