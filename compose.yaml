# Production: NestJS server (Bun + Postgres + Typst) + nginx SPA.
# One database: Postgres. Dev overrides live in compose.dev.yaml.
services:
  db:
    image: postgres:16-alpine
    container_name: resume-god-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_god}
      POSTGRES_USER: ${POSTGRES_USER:-resume_god}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume-god-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-resume_god}"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: resume-god-server
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-resume_god}:${POSTGRES_PASSWORD:-resume-god-local}@db:5432/${POSTGRES_DB:-resume_god}
      OUTPUTS_DIR: /data/outputs
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
    env_file:
      - path: ./apps/server/.env
        required: false
    volumes:
      - server-data:/data
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: resume-god-web
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  server-data:
