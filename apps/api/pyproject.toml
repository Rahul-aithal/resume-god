[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-god"
version = "0.6.0"
description = "Profile-driven resume tooling"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.28",
    "pypdf>=6.0",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "authlib>=1.3",
    "itsdangerous>=2.1",
]

[project.scripts]
resume-god = "resume_god.cli:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["resume_god"]
