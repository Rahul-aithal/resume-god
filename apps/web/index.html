<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn your reviewed knowledge graph and a job description into an audited, tailored resume."
    />
    <title>resume-god</title>
    <!-- Set the theme before first paint so neither theme ever flashes. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("rg-theme");
          const dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          // No storage: stay on the light theme.
        }
      })();
    </script>
    <meta
      name="theme-color"
      content="#f4f6f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c1219"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
