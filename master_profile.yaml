# The two original summaries are retained verbatim. They are tailored narratives,
# not canonical resume facts, so Phase 0 does not silently select one.
source_summaries:
  - source: automation_resume
    text: >-
      Full-stack developer and AI automation builder with production experience
      replacing manual workflows with LLM-powered pipelines, MCP servers, and
      agentic tooling. Proficient in Python, JavaScript/TypeScript, Go, Node.js,
      FastAPI, and React, with hands-on experience building n8n automation
      workflows, MCP servers, LLM API integrations, and end-to-end AI agents.
      Delivered a production AI summarization pipeline at a professional
      internship and built an MCP server used by a live LLM agent — demonstrating
      the ability to ship real AI infrastructure independently.
  - source: swe_resume
    text: >-
      Full-stack Software Engineer and final-year B.E. Computer Science student
      with production internship experience at two companies — currently building
      admin platform UI at XParth Technologies using Next.js, TypeScript, and
      TanStack, and previously delivering backend APIs, microservices, and
      cloud-deployed SaaS at Pragya Cyber Ltd. Proficient in Node.js, NestJS,
      TypeScript, React, Next.js, and REST APIs, with solid working knowledge of
      PostgreSQL, MongoDB, Docker, and AWS EC2.

