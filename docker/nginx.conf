server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # FastAPI backend (JSON API + OAuth + files)
  location /api/ {
    proxy_pass http://api:8000/api/;
    # $http_host keeps the port (:8080); $host drops it and breaks the
    # OAuth redirect_uri (Google rejects localhost vs localhost:8080).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Generated PDFs / Typst sources served by the api
  location /files/ {
    proxy_pass http://api:8000/files/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
